name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias clinic_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore clinic.keystore \
            -storepass clinic123 \
            -keypass clinic123 \
            -dname "CN=Clinic Radar, OU=Clinic, O=Clinic, L=City, S=State, C=US" \
            -noprompt

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign \
            --ks clinic.keystore \
            --ks-key-alias clinic_key \
            --ks-pass pass:clinic123 \
            --key-pass pass:clinic123 \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-radar-release
          path: app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30
